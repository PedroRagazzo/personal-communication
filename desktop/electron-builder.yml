# O nome que aparece (janela, atalho, "Aplicativos", instalador) é só
# productName. appId, executableName e o "name" do package.json continuam
# os antigos de propósito: o appId é a chave do registro que faz o instalador
# novo substituir o antigo (trocar instala um segundo app do lado); o "name"
# decide a pasta de instalação e a pasta de dados (%APPDATA%\tora-dos-burro-desktop,
# onde ficam a sessão e as configurações — trocar desloga todo mundo); e o
# .exe mantém o nome pra não quebrar atalhos fixados na barra de tarefas.
appId: com.toradosburro.desktop
productName: TORA
directories:
  buildResources: build
files:
  - '!src/**'
  - '!tests/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*}'
# Nenhuma dependência nativa no desktop/package.json (livekit-client, phoenix,
# react, zustand são todos JS puro) — não há nada pra recompilar pro ABI do
# Electron, então pular esse passo só economiza tempo de build.
# Ícone da bandeja do Windows (main/index.ts, createTray) — build/ não entra
# no pacote por padrão (só serve de fonte pro ícone do .exe/instalador em si),
# então precisa ser copiado à parte pra existir em disco em runtime.
extraResources:
  - from: build/icon.ico
    to: icon.ico
npmRebuild: false
win:
  executableName: tora-dos-burro
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: tora-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
