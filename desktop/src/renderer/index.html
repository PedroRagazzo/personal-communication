<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- :7880 + wss:/https: (Go Live): a URL do LiveKit é dinâmica, devolvida
         pelo backend em tempo de execução (join/golive:start), não dá pra
         fixar um host só — dev usa a porta 7880 padrão do --dev do LiveKit,
         prod usa host arbitrário (LIVEKIT_URL). O client oficial
         (livekit-client) abre tanto um WebSocket quanto um preflight HTTP
         "validate" pro mesmo host, por isso os dois esquemas precisam de
         liberação (confirmado ao vivo: o preflight http:// ainda era
         bloqueado mesmo com só ws:// liberado).

         2.28.229.48 = backend de produção (VPS via Dokploy, ver
         docs/roadmap.md) — sem domínio ainda, por isso http:// puro (não
         https://) e via IP direto. Troca pra um domínio real quando esse
         deploy ganhar um. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:4000 ws://localhost:4000 ws://localhost:5173 ws://localhost:7880 http://localhost:7880 http://2.28.229.48 ws://2.28.229.48 wss: https:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TORA DOS BURRO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
