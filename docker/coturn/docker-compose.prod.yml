# Deploy de produção do coturn (TURN/STUN), via Dokploy — Compose Type
# "Docker Compose" (não "Stack"/Swarm), rodando com `docker compose` puro
# direto no host da VPS. É isso que permite usar `network_mode: host` sem as
# limitações de rede do Docker Swarm (a faixa larga de portas UDP que o TURN
# precisa não convive bem com o routing mesh do Swarm — ver docs/roadmap.md,
# item 10, "Achado, não corrigido ainda").
#
# Config via arquivo montado (turnserver.prod.conf, mesmo diretório) + UM
# único override de linha de comando pro segredo. Tentativa anterior (só
# linha de comando, sem arquivo, com `-n`) fez o turnserver travar em loop de
# reinício (exit 255, despejando o próprio --help) — o parser de CLI
# (getopt_long) claramente não aceitou algo naquela lista longa de flags. Só
# `-c <arquivo> --static-auth-secret=<valor>` reduz a superfície pro parser
# de CLI a uma única flag, testada isoladamente (todas as outras diretivas
# vão pelo parser do arquivo de config, o mesmo já usado sem problema em
# desenvolvimento desde a FASE 6).
#
# ${TURN_SECRET} vem da aba "Environment" deste serviço no Dokploy (nunca
# commitado aqui) e precisa ser EXATAMENTE igual ao TURN_SECRET do serviço
# `backend` — é o mesmo segredo dos dois lados do HMAC da TURN REST API (ver
# backend/lib/tora_dos_burro/turn.ex). O arquivo montado não tem nenhum
# static-auth-secret — só essa única fonte, pra nunca divergir em silêncio.

services:
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
