# Configuração de produção do coturn (TURN/STUN), montada só-leitura no
# serviço "coturn" do Dokploy (ver docker-compose.prod.yml neste diretório).
#
# Mesmas diretivas do turnserver.conf de desenvolvimento (mesmo diretório),
# exceto: SEM static-auth-secret aqui — esse único valor vem só por linha de
# comando (--static-auth-secret=${TURN_SECRET}, no docker-compose.prod.yml),
# nunca commitado. Isso evita duas fontes de verdade pro segredo (arquivo +
# ambiente) — se a substituição de variável falhar por qualquer motivo, o
# coturn falha ao iniciar (sem segredo nenhum) em vez de silenciosamente
# aceitar conexões com o segredo de dev.
#
# external-ip não é usado: a VPS tem IP público direto na interface de rede,
# sem NAT (https://github.com/coturn/coturn/wiki/turnserver).
#
# Porta de relay: min-port/max-port não definidos, usa o default do coturn
# (49152-65535, RFC 5766).
#
# Sem TLS (no-tls/no-dtls): mesma decisão do resto desse deploy, que ainda
# não tem domínio/certificado (ver force_ssl em backend/config/prod.exs).

listening-port=3478

fingerprint
lt-cred-mech
use-auth-secret

realm=tora-dos-burro

no-multicast-peers

total-quota=100
stale-nonce=600

no-tls
no-dtls
