# Configuração mínima de desenvolvimento local do coturn (TURN/STUN).
#
# Usa o mecanismo "TURN REST API" (use-auth-secret + static-auth-secret):
# o backend Elixir gera credenciais de curta duração (usuário = timestamp,
# senha = HMAC do timestamp com este segredo) em vez de expor um
# usuário/senha estático — evita que o servidor vire um relay aberto.
# Ver docs/security.md.
#
# ATENÇÃO: troque `static-auth-secret` antes de qualquer uso fora de
# localhost. Este arquivo é só para desenvolvimento.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=dev-only-change-me-before-any-shared-use

realm=tora-dos-burro.local

# Evita que o coturn tente relayar para endereços internos/privados
# (proteção básica contra abuso do relay em ambientes não-dev).
no-multicast-peers

total-quota=100
stale-nonce=600

# Em desenvolvimento local não há certificado TLS configurado; a FASE 16
# (segurança) deve adicionar cert-file/pkey-file reais para produção.
no-tls
no-dtls
